syntax = "proto3";

package jijidown.core;

option go_package = "github.com/JiJiDown/JiJiDownCore-go/common/jijidown";
option csharp_namespace = "JiJiDown.Core.SDK";

import "google/protobuf/empty.proto";
import "type/api.proto";
import "type/video.proto";
import "type/taskstatus.proto";
import "type/taskdo.proto";

// Task
service Task {
  // 创建新任务
  rpc New(TaskNewReq) returns (google.protobuf.Empty);
  // 批量创建新任务
  rpc NewBatch(TaskNewBatchReq) returns (TaskNewBatchReply);
  // 任务状态
  rpc Status(TaskStatusReq) returns (TaskStatusReply);
  // 获取任务列表
  rpc List(TaskListReq) returns (TaskListReply);
  // 任务控制 (暂停, 继续, 删除)
  rpc Control(TaskControlReq) returns (google.protobuf.Empty);
  // 任务完成通知
  rpc Notification(google.protobuf.Empty) returns (stream TaskNotificationReply);
}

// 创建新任务-请求
//
// ⚠️ 字段 8~11 已**按实测结果修正**，与上游公开的那份 proto 不同。
//
// 这份字段表来自两条互相独立的证据：
//   1. 用自写的 FileDescriptorProto 解码器读核心
//      `Vendor/JiJiDownCore-darwin-arm64`（git.r339）**内嵌的描述符**，
//      其中 TaskNewReq 的字段 8 是 `source(SourceType)`；
//   2. 对活核心做行为验证（见下）。
//
// 上游公开 proto（厂商自己的 JiJiDown/jithon 仓库）漏掉了 `source`，
// 于是字段 8 被标成 save_filename、后面整体错位一位。照它发请求的后果：
//   - `save_filename`、`audio_only` 落在核心不认识的位置上，wire type 也对
//     不上（.proto 里是 string/bool，核心在 8 处期待枚举、9 处期待 string），
//     被核心当作未知字段**静默丢弃** —— 传了也没用，还没有任何报错。
//   - `callback` 是 uint64、核心字段 10 是 bool audio_only，两者 wire type
//     都是 varint，于是**能被解出来**：callback 一旦非 0，就被核心当成
//     「仅下载音频」。
//
// 错位的行为证据：把字段 10 置非零 → 核心只拉音频流（产物名形如
// `-1-30216.m4s`），最终产出 253,067 字节的 mp3，且 TaskStatusReply.audio_only
// 翻成 true，任务 id 与请求参数一一对应；字段 10 为 0 → 正常拉视频+音频流
// 并合流出 mp4。这说明核心确实把字段 10 当 audio_only 在读。
message TaskNewReq {
  // aid
  int64 aid = 1;
  // bvid 和 aid 二个参数必传一个, bvid 优先级比 aid 高
  string bvid = 2;
  // cid
  int64 cid = 3;
  // 视频质量
  uint32 video_quality = 4;
  // 音频质量
  uint32 audio_quality = 5;
  // 视频编码格式
  VideoType video_codec = 6;
  // 下载使用的 API (WEB / TV / APP)
  ApiType api_type = 7;
  // 内容来源 (普通投稿 / 番剧 / 课程)（上游 proto 漏了这个字段，导致其后全部错位）
  SourceType source = 8;
  // 保存文件名
  string save_filename = 9;
  // 仅下载音频
  bool audio_only = 10;
  // 批量下载回调
  uint64 callback = 11;
}

// 任务创建状态
message TaskCreationStatus {
  // 批量下载回调
  uint64 callback = 1;
  // 错误详细信息
  string err = 2;
}

// 批量创建新任务-回复
message TaskNewBatchReply {
  // 批量下载 任务创建状态
  repeated TaskCreationStatus task_creation_status = 1;
}

// 批量创建新任务-请求
message TaskNewBatchReq {
  // 批量下载任务组
  repeated TaskNewReq new_tasks = 1;
}

// 任务状态-请求
message TaskStatusReq {
  // 任务 id
  string task_id = 1;
}

// 任务进度
message TaskProgress {
  // 总长度
  string total_length = 1;
  // 完成长度
  string completed_length = 2;
  // 剩余长度
  string left_length = 3;
  // 下载速度 每秒
  string download_speed = 4;
  // 下载完成预计时间
  string eta = 5;
  // 下载进度 1 - 100
  uint32 progress = 6;
}

// 任务状态-回复
message TaskStatusReply {
  // 任务 id
  string task_id = 1;
  // 任务标题名称
  string task_title = 2;
  // 视频清晰度角标
  string video_badge = 3;
  // 音频质量角标
  string audio_badge = 4;
  // 视频编码格式
  string video_codec = 5;
  // 下载使用的 API (WEB / TV / APP)
  ApiType api_type = 6;
  // 仅下载音频
  bool audio_only = 7;
  // 任务状态
  TaskStatusType task_status = 8;
  // 任务添加时间
  int64 add_time = 9;
  // 任务完成时间
  int64 complete_time = 10;
  // 任务进度
  TaskProgress progress = 11;
  // 下载文件保存路径
  string save_path = 12;
}

// 获取任务列表-请求
message TaskListReq {
  // 任务列表状态
  TaskStatusType task_status = 1;
}

// 获取任务列表-回复
message TaskListReply {
  // 任务列表状态
  repeated TaskStatusReply tasks = 1;
}

// 任务控制 (暂停, 继续, 删除)-请求
message TaskControlReq {
  // 任务 id
  string task_id = 1;
  // 操作
  TaskDo do = 2;
}

// 任务完成通知-回复
message TaskNotificationReply {
  // 任务 id
  string task_id = 1;
  // 任务标题名称
  string task_title = 2;
  // 平均下载速度
  string average_speed = 3;
  // 下载用时
  string elapsed_time = 4;
}