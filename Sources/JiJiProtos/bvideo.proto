syntax = "proto3";

package jijidown.core;

option go_package = "github.com/JiJiDown/JiJiDownCore-go/common/jijidown";
option csharp_namespace = "JiJiDown.Core.SDK";

import "type/video.proto";
import "type/api.proto";
import "type/blinkresult.proto";

// Bvideo
service Bvideo {
  // 效验输入的内容, 有效返回 BLinkResult
  rpc CheckContent(BvideoContentReq) returns (BvideoCheckContentReply);
  // 获取视频信息
  rpc Info(BvideoContentReq) returns (BvideoInfoReply);
  // 查找此视频所有支持的清晰度
  rpc AllQuality(BvideoAllQualityReq) returns (BvideoAllQualityReply);
}

// Bvideo content 输入的内容-请求
message BvideoContentReq {
  // 输入的内容
  string content = 1;
}

// 效验输入的内容, 有效返回 BLinkResult-回复
message BvideoCheckContentReply {
  // 数据有效
  bool is_valid = 1;
  // B站 URL 检测结果
  BLinkResult blink_result = 2;
}

// 获取视频信息-回复
//
// ⚠️ 本消息的字段 3 已被**按实测结果修正**，与上游公开的那份 proto 不同。
//
// 上游公开 proto（来自厂商自己的 JiJiDown/jithon 仓库，最后更新 2023-08，
// 比本机跑的 r339 核心旧了三年）把字段 3 声明为
// `string video_title`、把视频块放在字段 14。但实测核心 git.r339 返回的
// 字节流在字段 3 处放的是**嵌套消息**，当成字符串解会直接报
// "String field had bad UTF-8"，整个 Info 调用失败：
//
//   field 1 = BLinkResult          （与上游一致）
//   field 2 = bytes 封面图          （与上游一致）
//   field 3 = 消息 { 1:"主要"  2:分P }  ← 上游说是 string，实际是视频块
//
// 字段 1、2 都对得上，说明不是完全换了一套 schema，只有字段 3 这一处
// 从「字符串标题」变成了「视频块列表」。因此这里保留其余字段原样，
// 只把 3 改成 BvideoBlock、并去掉原来重复的 14。
//
// 注意：标题不再由本消息提供，要从 block[].list[].page_title 取。
message BvideoInfoReply {
  // B站 URL 检测结果
  BLinkResult blink_result = 1;
  // 视频元信息
  //
  // 修正：上游 proto 把字段 2 标成 `bytes video_cover`，实测那里是一个
  // **嵌套消息** —— 封面只是它的一号子字段。照上游当 bytes 读，拿到的是
  // 整段嵌套消息的字节，喂给图片解码器必然失败。界面上的表现就是：
  // 封面一片空白、UP 主和简介全是空的。
  BvideoMeta meta = 2;
  // 视频列表块（修正：上游 proto 误标为 string video_title）
  repeated BvideoBlock block = 3;
  // 备注：上游 proto 在这个消息里还定义了 video_filename(4)、video_desc(5)、
  // sub_sort(6)、sort(7)、up_name(9)、up_mid(10)、up_face(11)、
  // bili_pubdate_str(12)、is_stein_gate(13)。实测 r339 的顶层响应**只有
  // 字段 1、2、3**，这些一个都不发 —— 内容现在都在 `meta` 里。这里不再保留，
  // 免得读到永远为空的字段还以为是自己用错了。
}

// 视频元信息（`BvideoInfoReply.meta`）。
//
// 字段编号与含义均为实测所得：对两个不同视频（BV1SSQLBREVV、BV1t93W6CEh2）
// 抓原始 wire 字节逐一比对确认。
//   - 1 与 9 都是 JPEG（头 ffd8ffe0）
//   - 8 在两个视频里取值完全相同（3816626）→ 是 UP 主的 mid，不是播放量
message BvideoMeta {
  // 视频封面（JPEG）
  bytes cover = 1;
  // 视频标题
  string title = 2;
  // 实测与 title 内容完全相同的第二个标题字段，语义未确证
  string title_alt = 3;
  // 视频简介
  string desc = 4;
  // 分区，如「其他」
  string category = 5;
  // UP主昵称
  string up_name = 7;
  // UP主 mid
  int64 up_mid = 8;
  // UP主头像（JPEG）
  bytes up_face = 9;
  // 发布时间，形如 "2026-04-16 12:00:00"
  string pub_date = 10;
}

message BvideoBlock {
  // 块标题
  string block_title = 1;
  // 视频列表
  repeated BvideoPage list = 2;
}

message BvideoPage {
  // av 号
  int64 page_av = 1;
  // BV 号
  string page_bv = 2;
  // cid
  int64 page_cid = 3;
  // page 索引
  int32 page_index = 4;
  // page 封面
  bytes page_cover = 5;
  // page 标题
  string page_title = 6;
  // page 信息 (发布时间)
  repeated string page_info = 7;
  // 视频时长（修正：实测核心在字段 8 单独发时长文本，如 "47:44"，
  // 上游 proto 漏了这个字段，于是被当未知字段丢弃）
  string page_duration = 8;
}

// 查找此视频所有支持的清晰度-请求
message BvideoAllQualityReq {
  // aid
  int64 aid = 1;
  // bvid 和 aid 二个参数必传一个, bvid 优先级比 aid 高
  string bvid = 2;
  // cid
  int64 cid = 3;
}

message BvideoBVideoItem {
  // 清晰度 id
  uint32 quality_id = 1;
  // 清晰度文本 [e.g. 高清 1080P]
  string quality_text = 2;
  // 编码 [e.g. AVC]
  VideoType codec = 3;
  // 帧率 [e.g. 29.412 fps]
  string frame_rate = 4;
  // 比特率 [e.g. 525 kbps]
  string bit_rate = 5;
  // Stream 大小 [e.g. 15.92 MiB]
  string stream_size = 6;
  // item 来源 API
  ApiType api_type = 7;
}

message BvideoBAudioItem {
  // 清晰度 id
  uint32 quality_id = 1;
  // 清晰度文本 [e.g. 极高音质]
  string quality_text = 2;
  // 编码 [e.g. AAC]
  string codec_text = 3;
  // 比特率 [e.g. 321 kbps]
  string bit_rate = 4;
  // Stream 大小 [e.g. 9.74 MiB]
  string stream_size = 5;
  // item 来源 API
  ApiType api_type = 6;
}

// 查找此视频所有支持的清晰度-回复
message BvideoAllQualityReply {
  // Video Stream
  repeated BvideoBVideoItem video = 1;
  // Audio Stream
  repeated BvideoBAudioItem audio = 2;
}
